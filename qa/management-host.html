<!doctype html><meta charset="utf-8"><title>管理页 · 图片皮肤预览</title>
<style>body{margin:0;background:url('/qa-wallpaper') center/cover fixed;font:13px system-ui;color:#233c33}nav{height:44px;display:flex;align-items:center;gap:16px;padding:0 16px;background:#f5f8fa}a{color:#245449}button{font:inherit}iframe{display:block;border:0;width:100%;height:calc(100vh - 44px)}</style>
<nav><a href="/?page=agents" target="page">智能体</a><a href="/?page=skills" target="page">技能中心</a><a href="/?page=connectors" target="page">连接器中心</a><a href="/?page=registries" target="page">注册配置</a><a href="/?page=archives" target="page">已归档对话</a><button id="mode">切换明暗</button><button id="skin">切换皮肤</button><button id="background">图片 / 纯色</button><span>隔离演示数据</span></nav>
<iframe name="page" title="管理页面" src="/?page=registries"></iframe>
<script>let mode='light',skin='mist',background='host';const frame=document.querySelector('iframe');function apply(){document.documentElement.style.colorScheme=mode;frame.contentWindow.postMessage({type:'qa-appearance',mode,skin,background},location.origin)};document.querySelector('#mode').onclick=()=>{mode=mode==='light'?'dark':'light';apply()};document.querySelector('#skin').onclick=()=>{skin=skin==='mist'?'default':'mist';apply()};document.querySelector('#background').onclick=()=>{background=background==='host'?'opaque':'host';apply()};frame.onload=apply;</script>
