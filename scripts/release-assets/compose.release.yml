name: agent-webclient

services:
  webclient:
    container_name: agent-webclient
    image: agent-webclient:${WEBCLIENT_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BASE_URL: ${BASE_URL}
      DESKTOP_APP: ${DESKTOP_APP:-true}
      SHARE_API_BASE_URL: ${SHARE_API_BASE_URL:-}
      SHARE_APP_DOWNLOAD_URL: ${SHARE_APP_DOWNLOAD_URL:-}
      VOICE_BASE_URL: ${VOICE_BASE_URL:-}
    ports:
      - "${HOST_PORT:-11948}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
